services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sysaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sysaid}
      POSTGRES_DB: ${POSTGRES_DB:-sysaid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sysaid} -d ${POSTGRES_DB:-sysaid}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sysaid]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sysaid]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Point at the compose-network service names, overriding whatever
      # host/port backend/.env has for local (non-docker) development.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sysaid}:${POSTGRES_PASSWORD:-sysaid}@postgres:5432/${POSTGRES_DB:-sysaid}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Persist chat history + Chroma vector store across container restarts.
      - backend_data:/app/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks: [sysaid]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser calls this from the host, so it must be the host-published
        # backend URL/port, not the in-network "backend" service name.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_BACKEND_API_KEY: ${VITE_BACKEND_API_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks: [sysaid]

networks:
  sysaid:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_data:
